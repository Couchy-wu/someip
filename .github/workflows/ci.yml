name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker-tests:
    name: Docker 完整测试 (Ubuntu 22.04 + Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 vsomeip 测试镜像 (vsomeip 3.4.10 + vsomeip_py)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: arhud-vsomeip-test:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 解码管线回归测试 (test_pipeline.py)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/vsomeip_example:/app:ro" \
            -w /app \
            arhud-vsomeip-test python3 test_pipeline.py

      - name: vsomeip 真实两进程收发集成测试 (server.py + client.py)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/vsomeip_example:/app:ro" \
            -v "${{ github.workspace }}/docker/integration_test.sh:/tests/integration_test.sh:ro" \
            -w /app \
            arhud-vsomeip-test bash /tests/integration_test.sh

      - name: C++ 客户端兼容性验证 (min_cli ↔ Python 服务端)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/vsomeip_example:/app:ro" \
            -v "${{ github.workspace }}/docker/cpp_client_test.sh:/tests/cpp_client_test.sh:ro" \
            -v "${{ github.workspace }}/docker/min_cli.cpp:/tests/min_cli.cpp:ro" \
            -w /app \
            arhud-vsomeip-test bash /tests/cpp_client_test.sh

      - name: 20 服务集成测试 (server_multi.py + client_multi.py)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/vsomeip_example:/app:ro" \
            -v "${{ github.workspace }}/docker/integration_test_multi.sh:/tests/integration_test_multi.sh:ro" \
            -w /app \
            arhud-vsomeip-test bash /tests/integration_test_multi.sh

      - name: C++ 单应用订阅 20 服务验证 (min_cli_multi ↔ server_multi.py)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/vsomeip_example:/app:ro" \
            -v "${{ github.workspace }}/docker/cpp_client_test_multi.sh:/tests/cpp_client_test_multi.sh:ro" \
            -v "${{ github.workspace }}/docker/min_cli_multi.cpp:/tests/min_cli_multi.cpp:ro" \
            -w /app \
            arhud-vsomeip-test bash /tests/cpp_client_test_multi.sh

      - name: Windows 修复代码跨平台校验 (windows/ ↔ vsomeip)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/windows:/win:ro" \
            -v "${{ github.workspace }}/docker/cross_check_windows.sh:/tests/cross_check_windows.sh:ro" \
            -w /win \
            arhud-vsomeip-test bash /tests/cross_check_windows.sh

      - name: pcap 全链路测试 (构造 pcap → Ubuntu + Windows 程序)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/vsomeip_example:/app:ro" \
            -v "${{ github.workspace }}/windows:/win:ro" \
            -v "${{ github.workspace }}/docker/integration_test_pcap.sh:/tests/integration_test_pcap.sh:ro" \
            -w /app \
            arhud-vsomeip-test bash /tests/integration_test_pcap.sh

      - name: C++ 单应用服务端提供 20 服务验证 (min_svc_multi ↔ C++/Python 客户端)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/vsomeip_example:/app:ro" \
            -v "${{ github.workspace }}/docker/cpp_server_test_multi.sh:/tests/cpp_server_test_multi.sh:ro" \
            -v "${{ github.workspace }}/docker/min_svc_multi.cpp:/tests/min_svc_multi.cpp:ro" \
            -v "${{ github.workspace }}/docker/min_cli_multi.cpp:/tests/min_cli_multi.cpp:ro" \
            -w /app \
            arhud-vsomeip-test bash /tests/cpp_server_test_multi.sh

      - name: AR-HUD 23 服务集成测试 (hud_server.py + hud_client.py)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/vsomeip_example:/app:ro" \
            -v "${{ github.workspace }}/hud:/hud:ro" \
            -v "${{ github.workspace }}/docker/integration_test_hud.sh:/tests/integration_test_hud.sh:ro" \
            -w /app \
            arhud-vsomeip-test bash /tests/integration_test_hud.sh

      - name: AR-HUD pcap 全链路测试 (生成 pcap → 服务端回放 → 客户端接收)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/vsomeip_example:/app:ro" \
            -v "${{ github.workspace }}/hud:/hud:ro" \
            -v "${{ github.workspace }}/docker/integration_test_hud_pcap.sh:/tests/integration_test_hud_pcap.sh:ro" \
            -w /hud \
            arhud-vsomeip-test bash /tests/integration_test_hud_pcap.sh

      - name: AR-HUD C++ 客户端集成测试 (Python 服务端 ↔ C++ vsomeip 客户端)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/hud_cpp:/hudcpp:ro" \
            -v "${{ github.workspace }}/hud:/hud:ro" \
            -v "${{ github.workspace }}/docker/integration_test_hud_cpp.sh:/tests/integration_test_hud_cpp.sh:ro" \
            -w /hudcpp \
            arhud-vsomeip-test bash /tests/integration_test_hud_cpp.sh

      - name: 双机通信测试 (双容器/双网络命名空间, SD 多播)
        run: |
          bash ${{ github.workspace }}/docker/integration_test_dual_host.sh

      - name: to_longjie 板端真实客户端 ⇄ Python 服务端 (x86 客户端 + SP 库)
        run: |
          bash ${{ github.workspace }}/docker/integration_test_longjie.sh
        timeout-minutes: 10

      - name: to_longjie 固定配置客户端 ⇄ Python 服务端 (RM宿主 + 不改客户端配置)
        run: |
          bash ${{ github.workspace }}/docker/integration_test_longjie_fixedcfg.sh
        timeout-minutes: 10

      - name: C++ 服务端库 + Python 调用 ⇄ 真实客户端 (libarhud_server.so)
        run: |
          bash ${{ github.workspace }}/docker/integration_test_cpplib.sh
        timeout-minutes: 10
