# my_yolov8m.yaml
# YOLOv8m 模型结构配置文件（中型模型）

# 模型参数
nc: 1  # 类别数量（请根据你的数据集修改）

# 网络深度和宽度控制参数
depth_multiple: 0.67   # 控制模型深度
width_multiple: 0.75   # 控制通道宽度

# Anchor-free 检测，不需要预定义 anchor
anchors: 3

# -------------------------------
# Backbone: 特征提取部分
# -------------------------------
backbone:
  # [from, number, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 6, C2f, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 6, C2f, [512, True]]        # 6
  - [-1, 1, Conv, [512, 3, 2]]       # 7-P5/32
  - [-1, 3, C2f, [512, True]]        # 8
  - [-1, 1, SPPF, [512, 5]]          # 9-SPPF 模块

# -------------------------------
# Head: 特征融合 + 检测头
# -------------------------------
head:
  - [-1, 1, Conv, [256, 1, 1]]                 # 10 减少通道数
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]    # 11 上采样
  - [[-1, 6], 1, Concat, [1]]                  # 12 与 P4 融合
  - [-1, 3, C2f, [256]]                        # 13

  - [-1, 1, Conv, [128, 1, 1]]                 # 14 减少通道数
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]    # 15 上采样
  - [[-1, 4], 1, Concat, [1]]                  # 16 与 P3 融合
  - [-1, 3, C2f, [128]]                        # 17

  - [-1, 1, Conv, [128, 3, 2]]                 # 18 下采样
  - [[-1, 14], 1, Concat, [1]]                 # 19 与 P4 融合
  - [-1, 3, C2f, [256]]                        # 20

  - [-1, 1, Conv, [256, 3, 2]]                 # 21 下采样
  - [[-1, 9], 1, Concat, [1]]                  # 22 与 P5 融合
  - [-1, 3, C2f, [512]]                        # 23

  - [[17, 20, 23], 1, Detect, [nc]]            # 24 检测头（输出3个尺度）
