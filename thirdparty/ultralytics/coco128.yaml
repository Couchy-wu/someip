# Example dataset configuration for COCO128 (a tiny subset of COCO)

# -----------------------------------------------------------------
# 1️⃣  数据根目录（相对路径或绝对路径均可）
# -----------------------------------------------------------------
path: ../coco128/coco128/  # dataset root dir

# -----------------------------------------------------------------
# 2️⃣  训练 / 验证 / 测试 数据集的相对路径
# -----------------------------------------------------------------
train: images/train2017  # train images (relative to 'path')
val:   images/val2017    # val images (relative to 'path')
#test:  images/test2017   # test images (optional, may be omitted)

# -----------------------------------------------------------------
# 3️⃣  类别数
# -----------------------------------------------------------------
nc: 81  # number of classes (COCO has 80 categories)

# -----------------------------------------------------------------
# 4️⃣  类别名称（顺序必须与标注文件中的 class id 对应）
# -----------------------------------------------------------------
